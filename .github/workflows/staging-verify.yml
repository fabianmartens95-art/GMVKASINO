name: Staging Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging:
    name: Verify deployed staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate staging target
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PRIMARY_BASE_URL: ${{ secrets.PRIMARY_BASE_URL }}
        run: |
          set -eu
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "STAGING_BASE_URL is required in the GitHub staging environment" >&2
            exit 1
          fi
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo "STAGING_BASE_URL must use https://" >&2; exit 1 ;;
          esac
          if [ -n "$PRIMARY_BASE_URL" ] && [ "$STAGING_BASE_URL" = "$PRIMARY_BASE_URL" ]; then
            echo "Staging and primary base URLs must be different" >&2
            exit 1
          fi
      - name: Run remote staging smoke check
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: npm run smoke
      - name: Record verification summary
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          {
            echo "## GMVKASINO staging verification"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Environment: \`staging\`"
            echo "- Remote smoke: passed"
            echo "- Target configured through GitHub Environment secret \`STAGING_BASE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
