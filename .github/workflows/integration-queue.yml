name: Automatic Integration Queue

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [edited, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: automatic-integration-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted queue policy
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate queue policy syntax
        run: node --check scripts/ci/integration-queue.mjs

      - name: Process one safe queue action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_REQUIRED_CHECK: test-and-build
          QUEUE_BASE_BRANCH: main
        run: node scripts/ci/integration-queue.mjs
