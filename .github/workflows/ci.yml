name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gmvkasino
          POSTGRES_PASSWORD: gmvkasino
          POSTGRES_DB: gmvkasino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmvkasino -d gmvkasino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Production smoke check
        run: npm run smoke
      - name: Validate Docker image
        run: docker build --tag gmvkasino:ci .
