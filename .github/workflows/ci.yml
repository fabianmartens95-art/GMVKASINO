name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gmvkasino
          POSTGRES_PASSWORD: gmvkasino
          POSTGRES_DB: gmvkasino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmvkasino -d gmvkasino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate integration queue policy
        run: node --check scripts/ci/integration-queue.mjs
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_test
        run: npm run db:migrate
      - name: Run tests
        run: npm test
      - name: Certify DEMO game catalog
        env:
          GAME_CERTIFICATION_SAMPLES: 250
        run: npm run games:certify
      - name: Reconcile demo ledger
        env:
          DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_test
          LEDGER_RECONCILE_ASSET: DEMO
        run: npm run ledger:reconcile
      - name: Reconcile sandbox payments
        env:
          DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_test
        run: npm run payments:reconcile
      - name: Create PostgreSQL recovery dump
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=gmvkasino \
            -v "${RUNNER_TEMP}:/backup" \
            postgres:16-alpine \
            pg_dump \
              -h 127.0.0.1 \
              -p 5432 \
              -U gmvkasino \
              -d gmvkasino_test \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file=/backup/gmvkasino-ci.dump
          test -s "${RUNNER_TEMP}/gmvkasino-ci.dump"
      - name: Restore PostgreSQL recovery dump
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=gmvkasino \
            postgres:16-alpine \
            psql \
              -h 127.0.0.1 \
              -p 5432 \
              -U gmvkasino \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS gmvkasino_restore WITH (FORCE)"
          docker run --rm --network host \
            -e PGPASSWORD=gmvkasino \
            postgres:16-alpine \
            psql \
              -h 127.0.0.1 \
              -p 5432 \
              -U gmvkasino \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE gmvkasino_restore"
          docker run --rm --network host \
            -e PGPASSWORD=gmvkasino \
            -v "${RUNNER_TEMP}:/backup" \
            postgres:16-alpine \
            pg_restore \
              -h 127.0.0.1 \
              -p 5432 \
              -U gmvkasino \
              -d gmvkasino_restore \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              /backup/gmvkasino-ci.dump
      - name: Verify restored PostgreSQL database
        env:
          DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_test
          RESTORE_DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_restore
          LEDGER_RECONCILE_ASSET: DEMO
        run: npm run db:restore:verify
      - name: Clean restore drill
        if: always()
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=gmvkasino \
            postgres:16-alpine \
            psql \
              -h 127.0.0.1 \
              -p 5432 \
              -U gmvkasino \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS gmvkasino_restore WITH (FORCE)"
          rm -f "${RUNNER_TEMP}/gmvkasino-ci.dump"
      - name: Build frontend
        run: npm run build
      - name: Production smoke check
        run: npm run smoke
      - name: Build container image
        run: docker build --tag gmvkasino:ci .
