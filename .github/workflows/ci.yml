name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gmvkasino
          POSTGRES_PASSWORD: gmvkasino
          POSTGRES_DB: gmvkasino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmvkasino -d gmvkasino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gmvkasino:gmvkasino@127.0.0.1:5432/gmvkasino_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Refresh M5 lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'm5-postgres-ops'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh package lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build container image
        run: docker build --tag gmvkasino:ci .
