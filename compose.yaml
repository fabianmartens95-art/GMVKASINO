services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gmvkasino
      POSTGRES_PASSWORD: gmvkasino
      POSTGRES_DB: gmvkasino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmvkasino -d gmvkasino"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://gmvkasino:gmvkasino@postgres:5432/gmvkasino
      DATABASE_SSL: "false"
    ports:
      - "8787:8787"

volumes:
  postgres_data:
